[EMC]
VERSION = 1.1
MACHINE = jog_setup
DEBUG = 0

[DISPLAY]
DISPLAY = ./test-ui.py
DEFAULT_LINEAR_VELOCITY = 0.5
MAX_LINEAR_VELOCITY = 2.0
DEFAULT_ANGULAR_VELOCITY = 10
MAX_ANGULAR_VELOCITY = 30

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = LIB:core_sim.hal

[TRAJ]
# no X: the first configured axis, Y, is selected at startup
COORDINATES = Y Z A
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 4.0

[KINS]
KINEMATICS = trivkins coordinates=YZA
JOINTS = 3

[AXIS_Y]
MIN_LIMIT = -10.0
MAX_LIMIT = 10.0
MAX_VELOCITY = 4
MAX_ACCELERATION = 100

[AXIS_Z]
MIN_LIMIT = -10.0
MAX_LIMIT = 10.0
MAX_VELOCITY = 4
MAX_ACCELERATION = 100

[AXIS_A]
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
MAX_VELOCITY = 90
MAX_ACCELERATION = 1000

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 4
MAX_ACCELERATION = 100
MIN_LIMIT = -10.0
MAX_LIMIT = 10.0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 4
MAX_ACCELERATION = 100
MIN_LIMIT = -10.0
MAX_LIMIT = 10.0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = ANGULAR
MAX_VELOCITY = 90
MAX_ACCELERATION = 1000
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
HOME_SEQUENCE = 0
